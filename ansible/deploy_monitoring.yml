---
- name: Deploy Observability Agents (Promtail + Node Exporter) on Branch Office Nodes
  hosts: branch
  become: true
  vars:
    promtail_version: "2.9.4"
    node_exporter_version: "1.8.2"
    loki_push_url: "http://loki.innovatech.internal:3100/loki/api/v1/push"

  tasks:
    - name: Update apt cache and install prerequisite tools
      ansible.builtin.apt:
        name:
          - unzip
          - curl
          - ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600

    # --- Prometheus Node Exporter (:9100) ---
    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Check if node_exporter binary already exists
      ansible.builtin.stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_bin

    - name: Download and extract Prometheus Node Exporter
      when: not node_exporter_bin.stat.exists
      block:
        - name: Download node_exporter tarball
          ansible.builtin.get_url:
            url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
            dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
            mode: "0644"

        - name: Unarchive node_exporter
          ansible.builtin.unarchive:
            src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
            dest: /tmp
            remote_src: true

        - name: Install node_exporter binary
          ansible.builtin.copy:
            src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
            dest: /usr/local/bin/node_exporter
            remote_src: true
            owner: root
            group: root
            mode: "0755"

        - name: Clean up node_exporter archive
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
            - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

    - name: Configure node_exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Ensure node_exporter service is enabled and running
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    # --- Grafana Promtail -> Loki (:3100) ---
    - name: Create promtail system user with adm log read access
      ansible.builtin.user:
        name: promtail
        system: true
        groups: adm
        append: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create Promtail configuration and state directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "0755"
      loop:
        - { path: "/etc/promtail", owner: "root", group: "root" }
        - { path: "/var/lib/promtail", owner: "promtail", group: "promtail" }

    - name: Check if promtail binary already exists
      ansible.builtin.stat:
        path: /usr/local/bin/promtail
      register: promtail_bin

    - name: Download and install Promtail binary
      when: not promtail_bin.stat.exists
      block:
        - name: Download promtail zip
          ansible.builtin.get_url:
            url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
            dest: "/tmp/promtail-{{ promtail_version }}.zip"
            mode: "0644"

        - name: Unarchive promtail zip
          ansible.builtin.unarchive:
            src: "/tmp/promtail-{{ promtail_version }}.zip"
            dest: /tmp
            remote_src: true

        - name: Install promtail binary
          ansible.builtin.copy:
            src: /tmp/promtail-linux-amd64
            dest: /usr/local/bin/promtail
            remote_src: true
            owner: root
            group: root
            mode: "0755"

        - name: Clean up promtail archive
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/promtail-{{ promtail_version }}.zip"
            - /tmp/promtail-linux-amd64

    - name: Write Promtail configuration (/etc/promtail/config.yml)
      ansible.builtin.copy:
        dest: /etc/promtail/config.yml
        owner: root
        group: promtail
        mode: "0640"
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /var/lib/promtail/positions.yaml

          clients:
            - url: {{ loki_push_url }}

          scrape_configs:
            - job_name: varlog
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: varlog
                    host: {{ inventory_hostname }}
                    stream: authlog
                    __path__: /var/log/auth.log
                - targets:
                    - localhost
                  labels:
                    job: varlog
                    host: {{ inventory_hostname }}
                    stream: syslog
                    __path__: /var/log/syslog
      notify: Restart promtail

    - name: Configure promtail systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/promtail.service
        mode: "0644"
        content: |
          [Unit]
          Description=Grafana Promtail Log Agent
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=promtail
          Group=promtail
          SupplementaryGroups=adm
          Type=simple
          ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail/config.yml
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart promtail

    - name: Ensure promtail service is enabled and running
      ansible.builtin.systemd:
        name: promtail
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true

    - name: Restart promtail
      ansible.builtin.systemd:
        name: promtail
        state: restarted
        daemon_reload: true
