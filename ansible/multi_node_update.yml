---
- name: Multi-Node Security Patches & System Upgrades (REQ-NCA-P1-05)
  hosts: branch,security
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all installed packages safely (idempotent)
      ansible.builtin.apt:
        upgrade: safe
      register: apt_upgrade_result

    - name: Ensure unattended security packages are present
      ansible.builtin.apt:
        name:
          - curl
          - unattended-upgrades
        state: present
