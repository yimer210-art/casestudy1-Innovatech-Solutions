# Ansible Inventory - Innovatech Solutions Case Study 2
# Bereikbaar vanaf Bastion Host (10.2.1.0/24) via AWS Transit Gateway + Route 53 Private DNS

[branch]
workstation-01   ansible_host=workstation-01.innovatech.internal
branch-server-01 ansible_host=branch-server-01.innovatech.internal

[security]
sec-monitoring-soar ansible_host=soar.innovatech.internal

[attacker]
attacker-node ansible_host=attacker.innovatech.internal

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/bastion-key
